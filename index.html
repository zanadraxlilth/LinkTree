<style>
:root{--bg:#000;--fg:#fff;--dim:#8a8a8a;--line:#2a2a2a;
  --font:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.logo{width:170px;height:auto;display:block}
.wordmark{width:100%;max-width:400px;height:auto;display:block;margin-top:22px}
nav{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:14px}
a.link{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;
  padding:18px 28px;color:var(--fg);text-decoration:none;font-weight:600;font-size:1.05rem;
  letter-spacing:.04em;border:1px solid var(--fg);
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);
  transition:background .15s,color .15s}
a.link svg{width:22px;height:22px;flex:none;margin-right:14px;fill:currentColor;align-self:center}
a.link svg.ig{fill:none;stroke:currentColor}
a.link span{margin-left:auto;padding-left:12px;font-weight:500;font-size:.85rem;color:var(--dim);letter-spacing:.02em;transition:color .15s}
a.link::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fg);
  transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.65,0,.35,1)}
a.link:hover::before,a.link:focus-visible::before{transform:scaleX(1)}
a.link:hover,a.link:focus-visible{color:var(--bg)}
a.link svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
a.link:hover svg,a.link:focus-visible svg{transform:scale(1.2) rotate(-10deg)}
a.link:hover span,a.link:focus-visible span{color:#444}
a.link:focus-visible{outline:2px solid var(--fg);outline-offset:4px;clip-path:none}
a.link:active{transform:translateY(1px)}
footer{margin-top:40px;font-size:.8rem;color:var(--dim)}
/* live wallpaper */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,0) 80%)}
main,footer{position:relative;z-index:1}
/* intro sequence: logo -> wordmark -> links */
@keyframes logo-in{from{opacity:0;transform:translateX(-28px) skewX(-14deg)}to{opacity:1;transform:none}}
@keyframes word-in{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes link-in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.logo{animation:logo-in .7s cubic-bezier(.2,.8,.2,1) .1s backwards,
  float 6s ease-in-out 1s infinite,glitch 7s steps(1,end) 3s infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes glitch{
  0%,91%,100%{filter:none;opacity:1}
  92%{filter:drop-shadow(5px 0 0 #fff);opacity:.85}
  93.5%{filter:drop-shadow(-5px 0 0 #fff);opacity:.5}
  95%{filter:drop-shadow(3px 0 0 #fff);opacity:1}
  96.5%{filter:none;opacity:.6}
  98%{filter:drop-shadow(-2px 0 0 #fff);opacity:1}}
.wordmark{
  -webkit-mask-image:linear-gradient(105deg,rgba(0,0,0,.7) 40%,#000 50%,rgba(0,0,0,.7) 60%);
  mask-image:linear-gradient(105deg,rgba(0,0,0,.7) 40%,#000 50%,rgba(0,0,0,.7) 60%);
  -webkit-mask-size:250% 100%;mask-size:250% 100%;
  animation:word-in .9s cubic-bezier(.65,0,.35,1) .55s backwards,shine 5s ease-in-out 2s infinite}
@keyframes shine{
  0%{-webkit-mask-position:0% 0;mask-position:0% 0}
  55%,100%{-webkit-mask-position:100% 0;mask-position:100% 0}}
a.link{animation:link-in .55s cubic-bezier(.2,.8,.2,1) backwards}
a.link:nth-child(1){animation-delay:1.2s}
a.link:nth-child(2){animation-delay:1.32s}
a.link:nth-child(3){animation-delay:1.44s}
footer{animation:fade-in .6s ease 1.8s backwards}
a.link:hover{transform:translateX(6px)}
a.link{transition:background .15s,color .15s,transform .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}
  .wordmark{-webkit-mask:none;mask:none}}
</style>

<script>
(function(){
  var c=document.getElementById('bg'),x=c.getContext('2d');
  var W,H,D,bars=[],mx=0,my=0,tx=0,ty=0,boost=0;
  var A=-38*Math.PI/180,dx=Math.cos(A),dy=Math.sin(A);
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function make(){
    return{x:rnd(-.2,1.2)*W,y:rnd(-.2,1.2)*H,len:rnd(.15,.5)*D,w:rnd(2,16),
      v:rnd(12,55),a:rnd(.05,.16),z:rnd(.3,1)};
  }
  function resize(){
    var r=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;D=Math.hypot(W,H);
    c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0);
    var n=Math.round(Math.min(34,Math.max(16,W*H/38000)));
    bars=[];for(var i=0;i<n;i++)bars.push(make());
    draw(0);
  }
  function draw(dt){
    x.clearRect(0,0,W,H);
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;boost=Math.max(0,boost-dt*4);
    for(var i=0;i<bars.length;i++){
      var b=bars[i];
      var sp=b.v*(1+boost*b.z);b.x+=dx*sp*dt;b.y+=dy*sp*dt;
      var px=b.x+mx*b.z*30,py=b.y+my*b.z*30;
      var ex=px+dx*b.len,ey=py+dy*b.len;
      if(Math.min(px,ex)>W+80||Math.max(py,ey)<-80||Math.max(px,ex)<-b.len-80||Math.min(py,ey)>H+80){
        // wrap: respawn on the bottom-left side so it travels up-right
        if(Math.random()<.5){b.x=rnd(-.3,.9)*W-b.len*dx;b.y=H+rnd(20,120)}
        else{b.x=-b.len*dx-rnd(20,120);b.y=rnd(.1,1.1)*H}
        continue;
      }
      var g=x.createLinearGradient(px,py,ex,ey);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(.6,'rgba(255,255,255,'+b.a+')');
      g.addColorStop(1,'rgba(255,255,255,'+(b.a*1.6)+')');
      x.strokeStyle=g;x.lineWidth=b.w;x.lineCap='butt';
      x.beginPath();x.moveTo(px,py);x.lineTo(ex,ey);x.stroke();
    }
    var gx=(mx+1)/2*W,gy=(my+1)/2*H,gr=Math.max(W,H)*.45;
    var rg=x.createRadialGradient(gx,gy,0,gx,gy,gr);
    rg.addColorStop(0,'rgba(255,255,255,'+(.09+boost*.02)+')');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=rg;x.fillRect(0,0,W,H);
  }
  var last=0,raf=0;
  function loop(t){
    var dt=Math.min((t-last)/1000||0,.05);last=t;
    draw(dt);raf=requestAnimationFrame(loop);
  }
  function start(){if(!still&&!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
  function stop(){cancelAnimationFrame(raf);raf=0}
  addEventListener('resize',resize);
  addEventListener('pointermove',function(e){
    tx=(e.clientX/W-.5)*2;ty=(e.clientY/H-.5)*2;
  },{passive:true});
  addEventListener('pointerdown',function(){boost=7});
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
  resize();start();
})();
</script>
